<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Работа курьером — Яндекс Еда, Лавка, Купер, Магнит, X5 Delivery</title>
<link rel="stylesheet" href="style.css"></head><body>
<div class="geo" id="geo"><span id="geo-text"></span><span><button class="ok" onclick="geoYes()">Да</button><button onclick="hide()">Другой город</button></span></div>
<section class="hero wrap">
  <h1>Работа курьером: свободный график,<br>выплаты каждый день</h1>
  <div class="sub">Пять сервисов в одном месте. Выберите свой город — покажем условия и доход.</div>
  <div class="pay">до 240 000 ₽</div>
  <div class="sub">в месяц на электровело в Москве</div>
  <div style="margin:20px 0">
  <select id="citysel"><option value="moskva">Москва</option><option value="himki">Химки</option><option value="spb">Санкт-Петербург</option><option value="kazan">Казань</option><option value="saratov">Саратов</option><option value="kyzyl">Кызыл</option></select>
  <button class="btn" style="margin-left:10px" onclick="location.href=document.getElementById('citysel').value+'.html'">Показать условия</button>
  </div>
  <div class="badges"><span class="badge">Свободный график</span><span class="badge">Выплаты каждый день</span><span class="badge">Без опыта</span><span class="badge">18+</span></div>
</section>
<footer>Курьер JOB — сборник условий пяти сервисов доставки. 18+</footer>
<script src="geo.js"></script></body></html>
